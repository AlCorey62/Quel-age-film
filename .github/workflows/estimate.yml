name: Estimation des sorties récentes

on:
  workflow_run:
    workflows: ["Synchronisation quotidienne"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  estimate:
    # ne s'exécute que si la synchro du jour a réussi
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements-ml.txt

      - name: Réentraîner le modèle (le dimanche)
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/train_age_model.py
            python3 scripts/test_age.py
          fi

      - name: Estimer les sorties récentes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$TMDB_TOKEN" ]; then
            echo "Secrets ANTHROPIC_API_KEY et TMDB_TOKEN absents : estimation ignorée."
            exit 0
          fi
          python3 scripts/estimate_age.py --new-releases 21

      - name: Publier les changements
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A docs/data/estimates.json docs/model
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "estimations $(date -u +%F)"
          git pull --rebase origin main
          git push
